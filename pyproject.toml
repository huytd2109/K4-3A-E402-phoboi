[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoboi"
version = "0.1.0"
description = "Verified-source-first Discord logistics assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "google-genai>=1.0",
  "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
discord = ["discord.py>=2.4"]

[project.scripts]
phoboi = "phoboi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
